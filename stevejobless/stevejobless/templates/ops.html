<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>SteveJobless — Operations Center</title>
  <style>
    :root { --bg: #0b0b0c; --card: #141416; --border: #282833; --text: #f4f4f5; --muted: #8b8b98; --accent: #00d9ff; --green: #22c55e; --red: #ef4444; --yellow: #eab308; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; min-height: 100vh; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .eyebrow { font-size: 10px; letter-spacing: .15em; color: var(--accent); font-weight: 700; }
    h1 { font-size: 22px; font-weight: 900; letter-spacing: .05em; }
    h1 span { color: var(--accent); }
    .btn { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn:hover { opacity: .85; }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    .hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .hero div { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .hero strong { display: block; font-size: 28px; color: var(--accent); }
    .hero span { font-size: 12px; color: var(--muted); }
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab { padding: 8px 16px; border-radius: 6px; background: var(--card); border: 1px solid var(--border); cursor: pointer; font-size: 13px; color: var(--muted); }
    .tab.active { background: var(--accent); color: #000; font-weight: 600; }
    .business-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .biz-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .biz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .biz-name { font-size: 18px; font-weight: 700; }
    .biz-domain { font-size: 12px; color: var(--muted); }
    .biz-progress { font-size: 13px; color: var(--accent); font-weight: 600; }
    .bar { height: 4px; background: var(--border); border-radius: 2px; margin: 12px 0; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
    .social-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .social-pill { font-size: 11px; padding: 4px 8px; border-radius: 4px; background: #1e1e24; border: 1px solid var(--border); }
    .social-pill.connected { border-color: var(--green); color: var(--green); }
    .social-pill.missing { border-color: var(--red); color: var(--red); }
    .resource-list { margin: 12px 0; }
    .resource-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .resource-item:last-child { border-bottom: none; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-READY { background: var(--green); }
    .status-MISSING { background: var(--red); }
    .status-UNKNOWN { background: var(--yellow); }
    .status-BLOCKED { background: var(--yellow); }
    .actions-list { margin-top: 12px; }
    .action-item { background: #1a1a20; border-radius: 8px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
    .action-title { font-weight: 600; margin-bottom: 4px; }
    .action-instructions { color: var(--muted); font-size: 12px; }
    .action-url { color: var(--accent); font-size: 12px; text-decoration: none; display: inline-block; margin-top: 4px; }
    .add-business { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; color: var(--muted); }
    .add-business:hover { border-color: var(--accent); color: var(--accent); }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; justify-content: center; align-items: center; }
    .modal.show { display: flex; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 400px; max-width: 90vw; }
    .modal-content h2 { margin-bottom: 16px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; background: #1a1a20; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .hidden { display: none; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <div class="eyebrow">BUSINESS OPS CENTER</div>
        <h1>STEVE<span>JOBLESS</span></h1>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" onclick="reconcileAll()">Reconcile All</button>
        <button class="btn" onclick="showAddModal()">+ Add Business</button>
      </div>
    </header>

    <section class="hero">
      <div><strong id="bizCount">—</strong><span>businesses</span></div>
      <div><strong id="actionCount">—</strong><span>need you</span></div>
      <div><strong id="avgProgress">—</strong><span>avg ready</span></div>
    </section>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('all')">All</div>
      <div class="tab" onclick="switchTab('needs-work')">Needs Work</div>
      <div class="tab" onclick="switchTab('ready')">Ready</div>
    </div>

    <div id="businessGrid" class="business-grid"></div>
  </div>

  <!-- Add Business Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h2>Add Business</h2>
      <div class="form-group">
        <label>Slug (URL-safe name)</label>
        <input id="newSlug" placeholder="my-business" />
      </div>
      <div class="form-group">
        <label>Display Name</label>
        <input id="newName" placeholder="My Business" />
      </div>
      <div class="form-group">
        <label>Domain</label>
        <input id="newDomain" placeholder="mybusiness.dev" />
      </div>
      <div class="form-actions">
        <button class="btn ghost" onclick="hideAddModal()">Cancel</button>
        <button class="btn" onclick="addBusiness()">Add</button>
      </div>
    </div>
  </div>

  <script>
    let businesses = [];
    let currentTab = 'all';

    async function load() {
      const r = await fetch('/api/ops/dashboard');
      const data = await r.json();
      businesses = data.businesses;
      document.getElementById('bizCount').textContent = data.total_businesses;
      document.getElementById('actionCount').textContent = data.total_pending_actions;
      const avg = businesses.length ? Math.round(businesses.reduce((s, b) => s + b.progress, 0) / businesses.length) : 0;
      document.getElementById('avgProgress').textContent = avg + '%';
      render();
    }

    function render() {
      const grid = document.getElementById('businessGrid');
      let filtered = businesses;
      if (currentTab === 'needs-work') filtered = businesses.filter(b => b.progress < 50);
      if (currentTab === 'ready') filtered = businesses.filter(b => b.progress >= 50);

      grid.innerHTML = filtered.map(b => `
        <div class="biz-card">
          <div class="biz-header">
            <div>
              <div class="biz-name">${b.name}</div>
              <div class="biz-domain">${b.domain || 'no domain'}</div>
            </div>
            <div class="biz-progress">${b.progress}%</div>
          </div>
          <div class="bar"><div class="bar-fill" style="width:${b.progress}%"></div></div>
          <div class="social-row">
            ${(b.social_accounts || []).map(s => `<span class="social-pill ${s.status === 'connected' ? 'connected' : 'missing'}">${s.platform}</span>`).join('')}
          </div>
          <details>
            <summary style="cursor:pointer;font-size:12px;color:var(--muted)">Resources (${(b.resources||[]).length})</summary>
            <div class="resource-list">
              ${(b.resources||[]).map(r => `
                <div class="resource-item">
                  <span><span class="status-dot status-${r.status}"></span>${r.label}</span>
                  <span style="color:var(--muted)">${r.status}</span>
                </div>
              `).join('')}
            </div>
          </details>
          ${(b.pending_actions||[]).length ? `
            <details>
              <summary style="cursor:pointer;font-size:12px;color:var(--yellow);margin-top:8px">Actions (${b.pending_actions.length})</summary>
              <div class="actions-list">
                ${b.pending_actions.slice(0, 3).map(a => `
                  <div class="action-item">
                    <div class="action-title">${a.title}</div>
                    <div class="action-instructions">${a.instructions}</div>
                    ${a.url ? `<a class="action-url" href="${a.url}" target="_blank">${a.url}</a>` : ''}
                  </div>
                `).join('')}
              </div>
            </details>
          ` : ''}
          <div style="margin-top:12px;display:flex;gap:8px;">
            <button class="btn ghost" onclick="reconcileOne('${b.slug}')" style="font-size:11px;padding:4px 8px">Reconcile</button>
            <button class="btn ghost" onclick="viewCredentials('${b.slug}')" style="font-size:11px;padding:4px 8px">Credentials</button>
          </div>
        </div>
      `).join('') + `
        <div class="add-business" onclick="showAddModal()">
          + Add Business
        </div>
      `;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    async function reconcileAll() {
      await fetch('/api/reconcile', { method: 'POST' });
      await load();
    }

    async function reconcileOne(slug) {
      await fetch(`/api/projects/${slug}/reconcile`, { method: 'POST' });
      await load();
    }

    function showAddModal() { document.getElementById('addModal').classList.add('show'); }
    function hideAddModal() { document.getElementById('addModal').classList.remove('show'); }

    async function addBusiness() {
      const slug = document.getElementById('newSlug').value.trim();
      const name = document.getElementById('newName').value.trim();
      const domain = document.getElementById('newDomain').value.trim();
      if (!slug || !name) return;
      await fetch('/api/ops/businesses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug, name, domain: domain || null })
      });
      hideAddModal();
      await load();
    }

    async function viewCredentials(slug) {
      const r = await fetch(`/api/ops/businesses/${slug}/credentials`);
      const creds = await r.json();
      alert(JSON.stringify(creds, null, 2));
    }

    load();
  </script>
</body>
</html>
