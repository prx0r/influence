<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio · youtube.agentcom.org</title>
<style>
:root{--bg:#161616;--bg2:#1d1d1f;--bg3:#252528;--bg4:#2f2f33;--line:#34343a;--text:#e6e6e6;--dim:#8a8a90;--acc:#e8a33d;--ok:#4ec9b0;--bad:#f47070;--warn:#dcb45a;--chan:#e8a33d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-columns:56px 1fr;grid-template-rows:1fr auto;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:var(--bg4);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.primary{background:var(--chan);color:#111;border-color:var(--chan);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
select,input,textarea{font:inherit;color:var(--text);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
a{color:var(--chan)}

/* rail: channels as the active entity, 56px, never more */
#rail{grid-row:1/3;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:6px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#rail .ch{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;background:var(--bg3);border:2px solid transparent;position:relative;color:var(--c,#ccc)}
#rail .ch:hover{background:var(--bg4)}
#rail .ch.on{border-color:var(--c,var(--acc));background:var(--bg4)}
#rail .ch .dot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--bg2)}
#rail .sep{width:28px;border-top:1px solid var(--line);margin:4px 0}
#rail .tip{position:fixed;left:62px;background:#000;color:#fff;padding:4px 8px;border-radius:5px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:200;display:none;box-shadow:0 2px 8px #0008}
#rail .foot{margin-top:auto;font-size:10px;color:var(--dim);text-align:center}
#rail .foot{border-top:1px solid var(--line);padding-top:6px;width:40px}
#rail .foot a{color:var(--dim);text-decoration:none;display:block;padding:4px;font-size:16px}
#rail .foot a:hover{color:var(--text)}

/* main */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#head{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg2);min-height:48px}
#head h1{font-size:16px;font-weight:650;white-space:nowrap}
#head .pitch{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg4);color:var(--dim);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.acc{color:var(--chan)}
#tabs{display:flex;gap:2px}
#tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:6px 10px;color:var(--dim)}
#tabs button.on{color:var(--text);border-bottom-color:var(--chan)}

#body{flex:1;min-height:0;display:flex}
.pane{flex:1;min-height:0;overflow:auto}

/* pilots tab: list | stage */
#pilots{display:grid;grid-template-columns:240px 1fr;height:100%}
#plist{border-right:1px solid var(--line);overflow:auto;padding:8px}
#plist h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:8px 6px 6px}
.pi{padding:7px 8px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:center}
.pi:hover{background:var(--bg3)}
.pi.on{background:var(--bg4)}
.pi .r{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--bad)}
.pi .r.y{background:var(--ok)}
.pi .t{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;line-height:1.25}
.pi .s{font-size:11px;color:var(--dim)}
#stage{overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:15px;margin-bottom:2px}
.sub{color:var(--dim);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.knobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 16px;margin-top:12px}
.knob label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:3px}
.knob input[type=range]{width:100%;accent-color:var(--chan)}
.knob select{width:100%}
.big{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.big button{padding:9px 16px;font-size:14px}
#now{display:flex;flex-direction:column;gap:8px}
#now audio{width:100%;height:44px}
.take{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg3)}
.take audio{width:100%;height:32px}
.take .k{font-size:11px;color:var(--dim)}
.take.full{outline:1px solid var(--chan)}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--bg4);color:var(--dim);text-transform:uppercase}
.badge.full{background:var(--chan);color:#111}
.status{font-size:12px;color:var(--dim)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--dim);border-top-color:var(--chan);border-radius:50%;animation:s 1s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
details summary{cursor:pointer;color:var(--dim);font-size:12px}
.empty{color:var(--dim);padding:30px;text-align:center}

/* config tabs */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:16px 20px;align-content:start}
#tab-thumb textarea,#tab-titles textarea{min-height:220px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin-top:10px;font-size:12px}
.kv div:nth-child(odd){color:var(--dim)}
textarea{width:100%;min-height:90px;resize:vertical}
.vopt{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--line)}

/* pi: drawer + global bar */
#pi{grid-column:2;border-top:1px solid var(--line);background:var(--bg2)}
#log{max-height:0;overflow:auto;transition:max-height .2s;padding:0 16px}
#pi.open #log{max-height:34vh;padding:10px 16px}
.m{margin:6px 0;max-width:900px;white-space:pre-wrap}
.m.you{color:var(--dim)}
.m.you::before{content:"you  ";color:var(--chan);font-weight:600}
.m.pi::before{content:"pi  ";color:var(--ok);font-weight:600}
#bar{display:flex;gap:8px;padding:8px 12px;align-items:center}
#ctx{font-size:11px;color:var(--dim);white-space:nowrap;max-width:28%;overflow:hidden;text-overflow:ellipsis}
#q{flex:1;padding:9px 12px;font-size:14px}
#toggle{background:transparent;border:none;color:var(--dim);font-size:12px}
.hint{font-size:11px;color:var(--dim);padding:0 16px 8px}
.hint b{color:var(--text);font-weight:500;cursor:pointer}
</style>
</head>
<body>
<nav id="rail"><div class="tip" id="tip"></div></nav>

<main id="main">
  <header id="head">
    <h1 id="cname">Studio</h1>
    <span class="chip" id="cstatus"></span>
    <span class="pitch" id="cpitch"></span>
    <span class="chip acc" id="cformula" title="Saved formula for this channel"></span>
    <nav id="tabs">
      <button data-t="pilots" class="on">Pilots</button>
      <button data-t="voices">Voices</button>
      <button data-t="thumb">Thumbnail</button>
      <button data-t="titles">Titles</button>
      <button data-t="formats">Formats</button>
    </nav>
  </header>
  <section id="body">
    <div class="pane" id="tab-pilots">
      <div id="pilots">
        <aside id="plist"></aside>
        <div id="stage"><div class="empty">Pick a channel on the left.</div></div>
      </div>
    </div>
    <div class="pane" id="tab-voices" hidden></div>
    <div class="pane" id="tab-thumb" hidden></div>
    <div class="pane" id="tab-titles" hidden></div>
    <div class="pane" id="tab-formats" hidden></div>
  </section>
</main>

<footer id="pi">
  <div id="log"></div>
  <div id="bar">
    <button id="toggle" title="Show / hide Pi">▴ Pi</button>
    <span id="ctx"></span>
    <input id="q" autocomplete="off" placeholder="Talk to Pi: “slower, more hushed”, “use Selene for Yuki”, “ok render full”, “save formula”">
    <button class="primary" id="send">Send</button>
  </div>
  <div class="hint" id="hints"></div>
</footer>

<script>
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {channels:[], slug:localStorage.ytSlug||'', view:null, pilot:null, knobs:null, job:null, take:null, history:[], tab:'pilots'};

async function api(method, path, body){
  if (DEMO) return demoApi(method, path, body);
  const r = await fetch(path, {method, credentials:'same-origin',
    headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}

/* ---------- rail ---------- */
function initials(n){ const w = String(n).replace(/[-_]/g,' ').split(/\s+/).filter(Boolean); return ((w[0]||'?')[0] + (w[1]?w[1][0]:'')).toUpperCase(); }
function renderRail(){
  const rail = $('#rail'); const tip = $('#tip');
  rail.innerHTML = ''; rail.appendChild(tip);
  for (const c of S.channels){
    const d = document.createElement('div');
    d.className = 'ch' + (c.slug === S.slug ? ' on' : '');
    d.style.setProperty('--c', c.accent || '#ccc');
    d.innerHTML = esc(initials(c.name)) + (c.formula ? '<span class="dot" title="formula saved"></span>' : '');
    d.onclick = () => selectChannel(c.slug);
    d.onmouseenter = () => { const r = d.getBoundingClientRect(); tip.textContent = `${c.name} · ${c.chairs_locked}/${c.chairs} voices${c.formula?' · formula':''}`; tip.style.top = (r.top+9)+'px'; tip.style.display='block'; };
    d.onmouseleave = () => tip.style.display='none';
    rail.appendChild(d);
  }
  const f = document.createElement('div'); f.className = 'foot';
  f.innerHTML = '<a href="/classic" title="Old full console (/classic)">⌂</a>';
  rail.appendChild(f);
}

async function loadChannels(){
  const r = await api('GET', '/api/studio/yt/channels');
  S.channels = r.channels || [];
  if (!S.slug || !S.channels.find(c => c.slug === S.slug)) S.slug = (S.channels[0]||{}).slug || '';
  renderRail();
  if (S.slug) selectChannel(S.slug);
}

async function selectChannel(slug){
  S.slug = slug; localStorage.ytSlug = slug; S.pilot = null; S.take = null;
  renderRail();
  const v = await api('GET', '/api/studio/yt/view?slug=' + encodeURIComponent(slug));
  if (v.error){ $('#stage').innerHTML = `<div class="empty">${esc(v.error)}</div>`; return; }
  S.view = v;
  document.documentElement.style.setProperty('--chan', v.accent || '#e8a33d');
  $('#cname').textContent = v.name;
  $('#cstatus').textContent = v.status || '';
  $('#cpitch').textContent = v.pitch || '';
  $('#cpitch').title = v.pitch || '';
  const f = v.formula || {};
  $('#cformula').textContent = f.knobs ? `formula v${f.version}` : 'no formula yet';
  S.knobs = Object.assign({speed: v.pace ?? 1.0, temperature: .7, volume_db: 0, preview_segments: 4, voices: {}}, f.knobs || {});
  if (S.knobs.speed == null) S.knobs.speed = v.pace ?? 1.0;
  const all = (v.pilots||[]);
  const remembered = localStorage['ytPilot:'+slug];
  S.pilot = all.find(p => p.path === remembered) || all[0] || null;
  renderPilots(); renderConfigTabs(); renderCtx(); renderHints();
}

/* ---------- pilots ---------- */
function pilotItem(p, tale){
  const name = p.file.replace(/\.(drama|read)\.txt$/,'').replace(/-/g,' ');
  const cut = p.cut && p.cut !== 'full' ? ` <span class="sub">[${esc(p.cut)}]</span>` : '';
  const vid = p.video_id ? ` <span class="sub" style="font-family:monospace">${esc(p.video_id)}</span>` : '';
  return `<div class="pi ${S.pilot && S.pilot.path===p.path?'on':''}" data-p="${esc(p.path)}" title="${esc(p.file)}">
    <span class="r ${p.ready?'y':''}" title="${p.ready?'ready':'not ready (score/gate)'}"></span>
    <span class="t">${esc(name)}</span>${cut}${vid}<span class="s">${p.score ?? ''}</span></div>`;
}
function renderPilots(){
  const v = S.view; if (!v) return;
  const mine = v.pilots || [], other = v.other_pilots || [];
  const group = (arr) => {
    const byColl = {};
    arr.forEach(p => {
      const c = p.collection || p.house || '?';
      (byColl[c] = byColl[c] || []).push(p);
    });
    return Object.keys(byColl).sort().map(c => {
      const tales = {};
      byColl[c].forEach(p => { (tales[p.tale || p.file] = tales[p.tale || p.file] || []).push(p); });
      return `<div class="sub" style="padding:4px 6px;color:var(--gold)">📁 ${esc(c)}</div>` +
        Object.keys(tales).sort().map(t => {
          const cuts = tales[t];
          const head = cuts.length > 1
            ? `<div style="padding:2px 6px;font-size:12px"><b>${esc(t)}</b> <span class="sub">${cuts.length} cuts</span></div>`
            : '';
          return head + cuts.map(p => pilotItem(p, t)).join('');
        }).join('');
    }).join('');
  };
  $('#plist').innerHTML =
    `<h3>${esc(v.name)} · ${mine.length}</h3>` + (group(mine) || '<div class="sub" style="padding:6px">No pilots for this channel yet.</div>') +
    (other.length ? `<details style="margin-top:10px"><summary style="padding:0 6px">Other houses (${other.length})</summary>${group(other)}</details>` : '');
  $('#plist').querySelectorAll('.pi').forEach(el => el.onclick = () => {
    const p = [...mine, ...other].find(x => x.path === el.dataset.p);
    S.pilot = p; localStorage['ytPilot:'+S.slug] = p.path; renderPilots(); renderCtx();
  });
  renderStage();
}

function takesFor(p){
  return (S.view.takes||[]).filter(t => !p || t.pilot_file === p.file || (t.pilot && (t.pilot.pilot||'').endsWith('/'+p.file)));
}

function knobSlider(key, label, min, max, step, fmt){
  const val = S.knobs[key] ?? min;
  return `<div class="knob"><label>${label}<b id="kv-${key}">${fmt(val)}</b></label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-k="${key}"></div>`;
}
function renderStage(){
  const p = S.pilot, v = S.view;
  if (!p){ $('#stage').innerHTML = `<div class="empty">No pilot selected. Pick one on the left, or ask Pi to draft one.</div>`; return; }
  const chairs = v.chairs || [];
  const voiceSel = chairs.filter(c => c.options.length).map(c => {
    const cur = S.knobs.voices[c.name] || (c.options.find(o=>o.locked)||{}).id || '';
    return `<div class="knob"><label>${esc(c.name)}<span>${c.locked?'locked':'casting'}</span></label>
      <select data-chair="${esc(c.name)}"><option value="">${c.locked?'channel lock':'script header'}</option>
      ${c.options.map(o => `<option value="${o.id}" ${S.knobs.voices[c.name]===o.id?'selected':''}>${esc(o.label)}${o.locked?' ★':''}</option>`).join('')}</select></div>`;
  }).join('');
  const takes = takesFor(p);
  const latest = S.take || takes[0];
  $('#stage').innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><h2>${esc(p.file.replace(/\.drama\.txt$/,''))}</h2>
      <div class="sub">${esc(p.house)} · ${p.kind} · ${p.chunks ?? '?'} chunks · prep ${p.score ?? '?'} · gate ${p.gate?'✓':'✗'} · poison ${p.poison?'✓':'✗'}</div></div>
      <span class="chip ${p.ready?'ok':'warn'}">${p.ready?'ready':'needs prep'}</span>
    </div>
    <div class="knobs">
      ${knobSlider('speed','Pace',0.5,1.3,0.01,x=>(+x).toFixed(2)+'×')}
      ${knobSlider('temperature','Expression',0,1,0.05,x=>(+x).toFixed(2))}
      ${knobSlider('volume_db','Volume',-6,4,0.5,x=>(+x>0?'+':'')+(+x).toFixed(1)+' dB')}
      ${knobSlider('preview_segments','Preview length',1,12,1,x=>x+' seg')}
      ${voiceSel}
    </div>
    <div class="big">
      <button class="primary" id="b-prev">▶ Hear preview</button>
      <button id="b-full">Render full audio</button>
      <button class="ghost" id="b-save">Save as formula</button>
      <span class="status" id="jobst">${S.job ? '<span class="spin"></span> rendering…' : '$0 · free tier'}</span>
    </div>
  </div>
  <div class="card" id="now">
    ${latest ? takeHtml(latest, true) : '<div class="sub">No takes yet. Hit “Hear preview”, listen, then tell Pi what to change.</div>'}
  </div>
  ${takes.length > 1 ? `<div class="card"><div class="sub" style="margin-bottom:8px">Earlier takes (${takes.length-1})</div><div style="display:flex;flex-direction:column;gap:6px">${takes.filter(t=>t!==latest).slice(0,12).map(t=>takeHtml(t,false)).join('')}</div></div>` : ''}
  <div class="card"><div class="row" style="justify-content:space-between"><div><h2>Video package</h2><div class="sub">titles + thumb + voices for this exact video</div></div><button class="ghost" id="b-vid">Open video workspace</button></div><div id="vidbox"></div></div>`;
  $('#stage').querySelectorAll('input[type=range]').forEach(el => el.oninput = () => {
    const k = el.dataset.k; S.knobs[k] = +el.value;
    $('#kv-'+k).textContent = ({speed:x=>(+x).toFixed(2)+'×',temperature:x=>(+x).toFixed(2),volume_db:x=>(+x>0?'+':'')+(+x).toFixed(1)+' dB',preview_segments:x=>x+' seg'})[k](el.value);
  });
  $('#stage').querySelectorAll('select[data-chair]').forEach(el => el.onchange = () => {
    if (el.value) S.knobs.voices[el.dataset.chair] = el.value; else delete S.knobs.voices[el.dataset.chair];
  });
  $('#b-prev').onclick = () => take(false);
  $('#b-full').onclick = () => take(true);
  $('#b-save').onclick = () => saveFormula();
  $('#stage').querySelectorAll('[data-reuse]').forEach(el => el.onclick = () => {
    const t = takes.find(x => x.name === el.dataset.reuse); if (t && t.knobs){ S.knobs = JSON.parse(JSON.stringify(t.knobs)); renderStage(); say('pi', 'Loaded the knobs from that take.'); }
  });
}
function takeHtml(t, big){
  const k = t.knobs || {};
  const isFull = t.take_kind === 'full';
  const meta = [k.speed!=null?`pace ${(+k.speed).toFixed(2)}`:'', k.temperature!=null?`expr ${(+k.temperature).toFixed(2)}`:'', Object.keys(k.voices||{}).length?`${Object.keys(k.voices).length} voice swap`:''].filter(Boolean).join(' · ');
  return `<div class="take ${isFull?'full':''}" style="${big?'grid-template-columns:auto 1fr auto;padding:12px':''}">
    <span class="badge ${isFull?'full':''}">${isFull?'full':'take'}</span>
    <div><audio controls preload="metadata" src="${esc(t.url)}"></audio>
      <div class="k">${esc(meta || t.voice || '')}${t.note?` · “${esc(t.note)}”`:''}</div></div>
    ${k.speed!=null ? `<button class="ghost" data-reuse="${esc(t.name)}" title="Load these knobs">reuse</button>` : '<span></span>'}
  </div>`;
}

async function take(full, note){
  if (!S.pilot){ say('pi','Pick a pilot first.'); return; }
  if (S.job){ say('pi','Still rendering the last take. One at a time keeps the free tier happy.'); return; }
  const r = await api('POST','/api/studio/yt/take',{channel:S.slug, path:S.pilot.path, knobs:S.knobs, full, note:note||''});
  if (!r.ok){ say('pi', 'Could not start: ' + (r.error || r.reason || 'unknown')); return; }
  S.job = r.job; renderStage();
  say('pi', full ? 'Rendering the full pilot audio ($0). This can take a few minutes; keep going.' : 'Rendering a preview…', true);
  poll(r.job, full);
}
async function poll(id, full){
  const t0 = Date.now();
  while (true){
    await new Promise(r => setTimeout(r, DEMO ? 600 : 2500));
    const j = await api('GET','/api/studio/yt/job?id='+id);
    const st = $('#jobst'); if (st && j.status==='running') st.innerHTML = `<span class="spin"></span> rendering ${full?'full':'preview'} · ${Math.round((Date.now()-t0)/1000)}s`;
    if (j.status === 'running') continue;
    S.job = null;
    if (j.status === 'done' && j.result && j.result.ok){
      const res = Object.assign({}, j.result);
      S.view.takes = [res, ...(S.view.takes||[])];
      S.take = res; renderStage();
      say('pi', full ? 'Full audio is ready. Want me to save these knobs as the channel formula?' : 'Preview ready. Tell me what to change, or say “ok render full”.');
      const a = document.querySelector('#now audio'); if (a) a.play().catch(()=>{});
    } else {
      renderStage();
      say('pi', 'Render failed: ' + ((j.result||{}).reason || j.status));
    }
    return;
  }
}
async function saveFormula(note){
  const latest = S.take || takesFor(S.pilot)[0];
  const r = await api('POST','/api/studio/yt/formula',{channel:S.slug, knobs:S.knobs, take:latest?latest.name:'', note:note||''});
  if (!r.ok){ say('pi','Save failed: '+(r.error||r.reason)); return; }
  S.view.formula = r.formula; $('#cformula').textContent = `formula v${r.formula.version}`;
  const c = S.channels.find(c => c.slug===S.slug); if (c){ c.formula = true; renderRail(); }
  say('pi', `Saved formula v${r.formula.version} for ${S.view.name}. New pilots on this channel start from it.`);
}

/* ---------- pi ---------- */
function say(who, text, quiet){
  const d = document.createElement('div'); d.className = 'm ' + who; d.textContent = text;
  $('#log').appendChild(d); $('#log').scrollTop = 1e9;
  if (!quiet || who==='pi') $('#pi').classList.add('open');
  S.history.push({role: who==='you'?'user':'assistant', content:text}); S.history = S.history.slice(-16);
}
function renderCtx(){
  $('#ctx').textContent = S.view ? `${S.view.name}${S.pilot?' · '+S.pilot.file.replace(/\.drama\.txt$/,''):''}` : '';
}
function renderHints(){
  const h = {pilots:['slower and more hushed','more expressive narrator','longer preview','ok render full','save formula'],
    voices:['propose 5 narrator voices'], thumb:['make the thumbnail template sharper'], titles:['write 5 title formulas'], formats:['propose 3 formats']}[S.tab] || [];
  $('#hints').innerHTML = h.length ? 'Try: ' + h.map(x=>`<b>${esc(x)}</b>`).join(' · ') : '';
  $('#hints').querySelectorAll('b').forEach(b => b.onclick = () => { $('#q').value = b.textContent; send(); });
}
async function send(){
  const q = $('#q').value.trim(); if (!q || !S.slug) return;
  $('#q').value = ''; say('you', q);
  // On the pilots tab with a pilot open, direction goes to the vibe loop first.
  if (S.tab === 'pilots' && S.pilot){
    const r = await api('POST','/api/studio/yt/vibe',{channel:S.slug, path:S.pilot.path, note:q, knobs:S.knobs});
    if (r.ok && r.intent && r.intent !== 'chat'){
      S.knobs = Object.assign(S.knobs, r.knobs || {}); renderStage();
      if (r.reply) say('pi', r.reply);
      if (r.intent === 'retake') return take(false, q);
      if (r.intent === 'render_full') return take(true, q);
      if (r.intent === 'save_formula') return saveFormula(q);
    }
  }
  const ctx = S.pilot ? ` [pilot:${S.pilot.file}] [knobs:${JSON.stringify({speed:S.knobs.speed,temperature:S.knobs.temperature})}]` : '';
  const thinking = document.createElement('div'); thinking.className='m pi'; thinking.innerHTML='<span class="spin"></span>'; $('#log').appendChild(thinking); $('#pi').classList.add('open');
  const r = await api('POST','/api/chat',{message:q + ctx, brand:S.slug, history:S.history.slice(0,-1)});
  thinking.remove();
  say('pi', r.reply || r.error || '(no reply)');
}
$('#send').onclick = send;
$('#q').addEventListener('keydown', e => { if (e.key==='Enter') send(); if (e.key==='Escape') $('#pi').classList.remove('open'); });
$('#toggle').onclick = () => { $('#pi').classList.toggle('open'); $('#toggle').textContent = $('#pi').classList.contains('open') ? '▾ Pi' : '▴ Pi'; };
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  if (e.key === ' ') { const a = document.querySelector('#now audio'); if (a){ e.preventDefault(); a.paused ? a.play() : a.pause(); } }
  if ((e.key === 'j' || e.key === 'k') && S.channels.length){ const i = S.channels.findIndex(c=>c.slug===S.slug); const n = S.channels[(i + (e.key==='j'?1:-1) + S.channels.length) % S.channels.length]; selectChannel(n.slug); }
});
