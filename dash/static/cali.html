<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cali — calibration studio</title>
<style>
:root{--bg:#141114;--bg2:#1e1a1e;--text:#e8e0e8;--dim:#9a8fa0;--gold:#D4A94E;--border:#2e2830;--green:#7fc97f}
body{background:var(--bg);color:var(--text);font:14px system-ui;margin:0;padding:20px;max-width:900px}
h1{font-size:18px}h2{font-size:15px;margin:18px 0 4px}
.sub{color:var(--dim);font-size:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{border-color:var(--gold)}
audio{width:100%;height:36px;margin-top:6px}
input{background:#0f0d0f;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px}
.pill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:#2a2530;color:var(--dim)}
</style></head><body>
<h1>🎯 Cali <span class="sub">calibration studio — predict, taste, improve</span></h1>
<div class="row"><button onclick="SRC='books';boot()">📚 books</button><button onclick="SRC='packs';boot()">🎭 character graph</button><span id="src" class="sub"></span></div>
<div id="next" class="card"><div class="sub">picking the most informative character…</div></div>
<h2>Top 5 — rank them</h2>
<div class="sub">Same stack as casting: engine scores + measured sleep-fit. Rank best-first, submit, weights refit.</div>
<div id="grid" class="grid"></div>
<div class="row"><button class="primary" onclick="submitRank()">submit ranking → calibrate</button><span id="msg" class="sub"></span></div>
<script>
const T=new URLSearchParams(location.search).get("token")||"";
const api=(m,p,b)=>fetch(p+'?token='+encodeURIComponent(T),{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CANDS=[];
let SRC='books';
async function boot(){
  const ch=(new URLSearchParams(location.search).get('channel'))||'folk-and-fable';
  document.getElementById('src').textContent = SRC==='packs' ? 'character graph packs' : 'book characters';
  if(SRC==='packs'){ await bootPack(); return; }
  const nx=await api('POST','/api/studio/cali/next',{channel:ch});
  const p=nx.pick;
  if(!p){document.getElementById('next').innerHTML='nothing left to calibrate 🎉';return}
  document.getElementById('next').innerHTML=`<b>Next: ${esc(p.name)}</b> <span class="pill">${esc(p.function)}</span><div class="sub">${esc(p.why)} · ${p.dialogue_lines} dialogue lines</div>`;
  const r=await api('POST','/api/studio/onboard/propose',{channel:ch,chair:p.name,n:5,direction:p.direction||p.name});
  CANDS=(r.candidates||[]).slice(0,5);
  document.getElementById('grid').innerHTML=CANDS.map((c,i)=>`<div class="card"><div class="row" style="justify-content:space-between;margin-top:0"><b>${i+1}. ${esc(c.name||c.voice_id)}</b><span class="pill">${c.score}</span></div>
    <div class="sub">${c.uses||0} uses · ${esc((c.tags||[]).slice(0,4).join(', '))}</div>
    <div class="sub" style="margin-top:4px">${esc(c.reason||'')}</div>
    ${c.sample?`<audio controls preload="metadata" src="${c.sample}"></audio>`:''}
    <div class="row">rank <input id="rk-${i}" size="2" placeholder="#"></div></div>`).join('');
  window._fn=r.function||'general';
}
async function submitRank(){
  const order=[];
  for(let i=0;i<CANDS.length;i++){
    const v=parseInt(((document.getElementById('rk-'+i)||{}).value||''),10);
    if(v>0)order.push({v,id:CANDS[i].voice_id});
  }
  if(order.length<2){document.getElementById('msg').textContent='rank at least 2';return}
  order.sort((a,b)=>a.v-b.v);
  const r=await api('POST','/api/studio/onboard/rank',{function:window._fn||'general',
    pack:window._pack||'',
    ordered_ids:order.map(o=>o.id),
    cards:CANDS.map(c=>({voice_id:c.voice_id,tags:c.tags||[]}))});
  document.getElementById('msg').textContent=r.ok?`calibrated (${r.pairs} pairs) — next character loading…`:'ERR';
  if(r.ok)setTimeout(boot,1200);
}
async function bootPack(){
  const r=await api('POST','/api/studio/cali/next-pack',{});
  if(!r.ok||!r.pick){document.getElementById('next').innerHTML='nothing left 🎉';return}
  const p=r.pick;
  document.getElementById('next').innerHTML=`<b>${esc(p.name)}</b> <span class="pill">${esc(p.archetype||'')}</span><div class="sub">${esc(p.why)}</div><div class="sub" style="margin-top:4px">${esc((p.persona||'').slice(0,220))}</div><div class="sub">modulators: ${esc((p.modulators||[]).join(', '))}</div>`;
  CANDS=(r.picks||[]).slice(0,5);
  window._fn='character';
  window._pack=p.pack;
  document.getElementById('grid').innerHTML=CANDS.map((c,i)=>`<div class="card"><div class="row" style="justify-content:space-between;margin-top:0"><b>${i+1}. ${esc(c.name||c.voice_id)}</b><span class="pill">${c.score??''}</span></div>
    <div class="sub">${esc((c.reason||'').slice(0,160))}</div>
    ${c.sample?`<audio controls preload="metadata" src="${c.sample}"></audio>`:''}
    <div class="row">rank <input id="rk-${i}" size="2" placeholder="#"></div></div>`).join('');
}
boot();
</script></body></html>
