<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>influence</title>
<style>
:root{--bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d2d;--bg4:#3c3c3c;--border:#404040;--text:#cccccc;--dim:#808080;--blue:#569cd6;--green:#4ec9b0;--red:#f44747;--yellow:#dcdcaa;--accent:#007acc}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.titlebar{height:30px;background:var(--bg3);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--border)}
.titlebar .menu{display:flex;gap:4px}
.titlebar .menu span{padding:2px 8px;border-radius:4px;cursor:pointer}
.titlebar .menu span:hover{background:var(--bg4)}
.main{flex:1;display:flex;overflow:hidden}
.activity{width:48px;background:var(--bg3);display:flex;flex-direction:column;align-items:center;padding-top:4px;border-right:1px solid var(--border)}
.activity .icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim);font-size:20px;position:relative}
.activity .icon:hover{color:var(--text)}
.activity .icon.active{color:var(--text);border-left:2px solid var(--accent)}
.activity .icon .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:10px 16px;font-size:11px;text-transform:uppercase;color:var(--dim);letter-spacing:1px;border-bottom:1px solid var(--border)}
.sidebar-content{flex:1;overflow-y:auto;padding:8px}
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;background:var(--bg3);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;border-right:1px solid var(--border);color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--bg);color:var(--text);border-top:2px solid var(--accent)}
.tab .close{opacity:0;font-size:14px;border-radius:4px;padding:0 4px}
.tab:hover .close{opacity:1}
.tab .close:hover{background:var(--bg4)}
.editor{flex:1;overflow-y:auto;padding:16px;min-height:0}
.chat-dock{border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.chat-dock .chat-input{display:flex;border-top:none;padding:8px}
.chat-dock .chat-input input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:4px;font-size:12px}
.chat-dock .chat-input button{margin-left:6px;background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:4px;cursor:pointer}
.chat-dock .dock-hint{padding:0 12px 4px;font-size:10px;color:var(--dim)}
.email-item{padding:8px 10px;border-bottom:1px solid var(--bg4);cursor:pointer;font-size:12px}
.email-item:hover{background:var(--bg3)}
.email-item .subj{font-weight:600}
.email-item .meta{color:var(--dim);font-size:10px;margin-top:2px}
.email-view{max-width:820px}
.email-view .hdr{border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px}
.email-view .hdr .from{font-weight:600}
.email-view .body{white-space:pre-wrap;font:13px/1.5 'SF Mono',Monaco,monospace;background:var(--bg2);padding:12px;border-radius:4px;border:1px solid var(--border)}
.email-view .actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.email-view .actions button{background:var(--bg4);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12px}
.email-view .actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.res{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg4);font-size:12px}
.pill{font-family:monospace;font-size:10px;padding:1px 8px;border-radius:20px;white-space:nowrap}
.READY{background:#123f2c;color:#7fe0a8}.MISSING{background:#3f2f12;color:var(--yellow)}.BLOCKED{background:#3f1a12;color:var(--red)}.UNKNOWN{background:#2b2d2d;color:#bbb}.ERROR{background:#3f1a12;color:#fff}
.bar{height:8px;background:#111;border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green)}
.bottom-content{height:150px;overflow-y:auto;padding:8px 16px;font:12px/1.4 'SF Mono',Monaco,monospace;color:var(--dim);border-top:1px solid var(--border);background:var(--bg2)}
.bottom-content .line{padding:1px 0}
.bottom-content .line .ts{color:#555;margin-right:8px}
.bottom-content .line .info{color:var(--blue)}
.bottom-content .line .ok{color:var(--green)}
.bottom-content .line .err{color:var(--red)}
.chat-panel{width:320px;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg2);position:relative}
.chat-divider{width:4px;cursor:col-resize;background:transparent;position:absolute;left:-2px;top:0;bottom:0;z-index:10}
.chat-divider:hover,.chat-divider.dragging{background:var(--accent)}
.rail-list{flex:1;overflow-y:auto;padding:8px}
.rail-seal{border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.guide-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.guide-row button{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:11px}
.guide-row button.ghost{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.sb-sms{padding:6px 8px;border-bottom:1px solid var(--bg4);font-size:11px}
.sb-sms .from{font-weight:600}
.sb-sms .at{color:var(--dim);font-size:10px}
.otp-strip{background:#1a2e1a;border:1px solid #2d5a2d;border-radius:6px;padding:8px 10px;margin:8px 0;font-size:12px}
.otp-strip .code{font:700 18px/1.2 'SF Mono',Monaco,monospace;color:var(--green);letter-spacing:2px}
.otp-strip .meta{color:var(--dim);font-size:10px;margin-top:4px}
.sms-live{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;background:var(--bg2);margin:8px 0}
.sms-live .row{padding:6px 8px;border-bottom:1px solid var(--bg4);font-size:11px}
.sms-live .row .from{font-weight:600}
.sms-live .row .code{color:var(--green);font-family:monospace;font-weight:700}
.sms-live .row .at{color:var(--dim);font-size:10px}
.badge.hot{background:#a33;animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.icon{position:relative}
.icon .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.chat-messages{flex:1;overflow-y:auto;padding:12px}
.chat-msg{margin-bottom:8px;font-size:12px}
.chat-msg .who{color:var(--dim);font-size:10px}
.chat-msg .text{margin-top:2px;padding:6px 10px;border-radius:4px;background:var(--bg3);word-break:break-word}
.chat-msg.you .text{background:#1a3a5a}
.chat-input{display:flex;border-top:1px solid var(--border);padding:8px}
.chat-input input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:12px}
.chat-input button{margin-left:6px;background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}
.vault-item{padding:8px 12px;border-bottom:1px solid var(--bg4);font-size:12px}
.vault-item .name{color:var(--blue)}
.vault-item .meta{color:var(--dim);font-size:10px}
.tree-item{padding:4px 8px 4px 16px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px}
.tree-item:hover{background:var(--bg3)}
.tree-header{padding:6px 8px;font-size:11px;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between}
.frm{padding:8px;display:flex;flex-direction:column;gap:6px}
.frm input,.frm select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px}
.frm button{background:var(--accent);color:#fff;border:none;padding:6px;border-radius:4px;cursor:pointer}
.identity-slot{padding:10px 12px;border-bottom:1px solid var(--bg4);font-size:12px;display:flex;align-items:center;gap:10px}
.identity-slot .slot-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.identity-slot .slot-icon.ready{background:#123f2c;color:#7fe0a8}
.identity-slot .slot-icon.pending{background:#2b2d2d;color:var(--dim)}
.identity-slot .slot-icon.error{background:#3f1a12;color:var(--red)}
.identity-slot .slot-info{flex:1;min-width:0}
.identity-slot .slot-name{font-weight:600;font-size:13px}
.identity-slot .slot-detail{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.identity-header{padding:16px;border-bottom:1px solid var(--border)}
.identity-header h2{margin:0 0 4px;font-size:18px}
.identity-header .meta{color:var(--dim);font-size:12px}
.identity-header .bar{margin-top:8px}
.identity-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.identity-grid .slot-card{background:var(--bg2);padding:14px;display:flex;flex-direction:column;gap:6px}
.identity-grid .slot-card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px}
.identity-grid .slot-card .value{font-size:13px;font-weight:500}
.identity-grid .slot-card .status{font-size:11px}
.account-item{padding:10px 12px;border-bottom:1px solid var(--bg4);cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12px}
.account-item:hover{background:var(--bg3)}
.account-item.active{background:var(--bg3);border-left:2px solid var(--accent)}
.account-item .acc-icon{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.account-item .acc-info{flex:1;min-width:0}
.account-item .acc-name{font-weight:600}
.account-item .acc-meta{color:var(--dim);font-size:10px}
.task{padding:8px 12px;border-bottom:1px solid var(--bg4);font-size:12px}
.task .t{font-weight:600}
.task .opts{display:flex;gap:6px;margin-top:6px}
.task .opts button{background:var(--bg4);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 10px;cursor:pointer;font-size:11px}
.task .opts button:hover{border-color:var(--accent)}
.fileview{white-space:pre-wrap;font:12px/1.5 'SF Mono',Monaco,monospace;background:var(--bg2);padding:12px;border-radius:4px;overflow-x:auto}
.filecrumb{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px}
.filecrumb input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:12px}
.filecrumb button{background:var(--bg4);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>

<div class="titlebar">
  <div class="menu"><span onclick="fileMenu(event)" style="cursor:pointer">File ▾</span><span onclick="quickChat('/help')" style="cursor:pointer">Help</span></div>
  <span style="margin-left:auto" id="title-brand">influence</span>
</div>

<div class="main">
  <div class="activity">
    <div class="icon active" onclick="switchView('chat',this)" title="Chat">💬</div>
    <div class="icon" onclick="switchView('accounts',this)" title="Accounts">👤</div>
    <div class="icon" onclick="switchView('phone',this)" title="Phone">📱<span class="badge" id="badge-sms" style="display:none">0</span></div>
    <div class="icon" onclick="switchView('email',this)" title="Email">✉️<span class="badge" id="badge-email" style="display:none">0</span></div>
    <div class="icon" onclick="switchView('content',this)" title="Content">🎬</div>
    <div class="icon" onclick="switchView('influencers',this)" title="Influencers">🛰</div>
    <div class="icon" onclick="switchView('vault',this)" title="Vault">🔑</div>
    <div class="icon" onclick="switchView('terminal',this)" title="Terminal">🖥</div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebar-title">Chat</div>
    <div class="sidebar-content" id="sidebar-content"></div>
  </div>
  <div class="editor-area">
    <div class="brandbar" id="brand-bar" style="display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--bg4);font-size:12px;align-items:center"></div>
    <div class="tabs" id="editor-tabs"></div>
    <div class="editor" id="editor-main"></div>
    <div class="bottom-content" id="bottom-content" style="display:none"></div>
    <div class="hud" id="hud" style="display:flex;gap:6px;align-items:center;padding:4px 10px;border-top:1px solid var(--border);background:var(--bg2);font-size:11px;overflow-x:auto;white-space:nowrap;min-height:26px"></div>
    <div class="chat-dock" id="chat-dock">
      <div class="dock-hint">Chat · operator model + live tools · Enter to send. Human confirms sends/spends.</div>
      <div class="chat-input">
        <input id="chat-in-main" placeholder="tasks · onboarding oddhobb · decide A-3 7 · check oddhobb.com" autocomplete="off">
        <button onclick="sendChatMain()">→</button>
      </div>
    </div>
  </div>
  <div class="chat-panel" id="chat-panel">
    <div class="chat-divider" id="chat-divider"></div>
    <div class="sidebar-header">HTasks — human rail</div>
    <div class="rail-list" id="rail-tasks"></div>
    <div class="rail-seal">
      <div class="tree-header">Seal secret (straight to vault)</div>
      <div class="frm">
        <input id="v-name" placeholder="NAME (e.g. X_BEARER)">
        <input id="v-value" type="password" placeholder="value — never touches chat" autocomplete="off">
        <select id="v-kind"><option value="service">service</option><option value="llm-inference">llm-inference</option><option value="cloudflare">cloudflare</option><option value="other">other</option></select>
        <button onclick="depositVault()">Seal into vault</button>
      </div>
    </div>
  </div>
</div>

<script>
const T=new URLSearchParams(location.search).get("token")||"";
const DASH_BUILD='2026-10-08e';
const api=(m,p,b,o)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),o?.timeoutMs||60000);return fetch(p+"?token="+encodeURIComponent(T),{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined,signal:c.signal}).finally(()=>clearTimeout(t)).then(r=>r.json())};
let S=null, openTabs=[], activeTab=null, curPath="";
let BRAND_SLUG='oddhobb';
const BRANDS={oddhobb:{name:'OddHobb',mailbox:'hello@oddhobb.com',domain:'oddhobb.com',logo:'brands/oddhobb.svg',accent:'#AC64F6'},pogtown:{name:'PogTown',mailbox:'hello@pogtown.com',domain:'pogtown.com',logo:'api/brand-logo?slug=pogtown',accent:'#E8A33D'},humanvoiced:{name:'HumanVoiced',mailbox:'hello@humanvoiced.com',domain:'humanvoiced.com',logo:'api/brand-logo?slug=humanvoiced',accent:'#22B8D4'}};
function paintBrandBar(){
  const bar=document.getElementById('brand-bar');
  if(!bar)return;
  bar.innerHTML='<span style="color:var(--dim)">Brand:</span>'+Object.entries(BRANDS).map(([slug,b])=>
    `<button onclick="setBrand('${slug}')" title="${esc(b.name)} · ${esc(b.domain)}" style="display:flex;align-items:center;gap:6px;border:1px solid ${slug===BRAND_SLUG?b.accent:'var(--border)'};border-radius:10px;padding:2px 10px 2px 2px;cursor:pointer;font-size:12px;${slug===BRAND_SLUG?'background:var(--bg3);font-weight:600':'background:transparent;color:var(--text)'}"><img src="${esc(b.logo)}" width="22" height="22" style="border-radius:6px" alt="">${esc(b.name)}</button>`
  ).join('')+`<button onclick="setBrand('global')" title="All entities" style="border:1px solid ${'global'===BRAND_SLUG?'var(--accent)':'var(--border)'};border-radius:10px;padding:2px 10px;cursor:pointer;font-size:12px;${'global'===BRAND_SLUG?'background:var(--bg3);font-weight:600':'background:transparent;color:var(--text)'}">🌐 Global</button>`+`<span style="color:var(--dim);font-size:11px">${BRAND_SLUG==='global'?'all entities':esc(BRANDS[BRAND_SLUG].mailbox)+' · '+esc(BRANDS[BRAND_SLUG].domain)}</span>`;
  paintTitleBrand();
}
function paintTitleBrand(){
  const t=document.getElementById('title-brand');
  if(!t)return;
  t.textContent=(BRAND_SLUG==='global'?'influence — all entities':'influence — '+BRANDS[BRAND_SLUG].name+' · '+BRANDS[BRAND_SLUG].domain)+' · '+DASH_BUILD;
}
function fileMenu(e){
  e.stopPropagation();
  const old=document.getElementById('file-menu');
  if(old){old.remove();return}
  const d=document.createElement('div');
  d.id='file-menu';
  d.style.cssText='position:fixed;top:32px;left:8px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:4px;z-index:99;min-width:190px';
  d.innerHTML=[['New chat','openTab(\'chat\',true)'],['Explorer','openTab(\'explorer\',true)'],['Refresh state','refresh()'],['Onboarding kit','quickChat(\'onboarding \'+BRAND_SLUG)']].map(([l,fn])=>`<div class="tree-item" onclick="${fn};document.getElementById('file-menu').remove()">${l}</div>`).join('');
  document.body.appendChild(d);
  const close=ev=>{if(!d.contains(ev.target)){d.remove();document.removeEventListener('click',close)}};
  setTimeout(()=>document.addEventListener('click',close),0);
}
function setBrand(slug){
  if(slug!=='global'&&!BRANDS[slug])return;
  BRAND_SLUG=slug;
  if(slug!=='global')EMAIL_MAILBOX=BRANDS[slug].mailbox;
  try{if(slug!=='global')document.documentElement.style.setProperty('--accent',BRANDS[slug].accent)}catch(e){}
  try{let l=document.querySelector('link[rel="icon"]');if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l)}if(slug!=='global')l.href=BRANDS[slug].logo}catch(e){}
  paintBrandBar();
  const mb=document.getElementById('email-mbox');
  if(mb)mb.value=EMAIL_MAILBOX;
  const st=document.getElementById('sidebar-title');
  if(st)st.textContent='Chat · '+(slug==='global'?'Global':BRANDS[slug].name);
  fetchEmail(15);
  if(typeof refresh==='function')refresh();
}
let smsCache=[], smsSeen={}, smsTimer=null, claimSmsTimer=null;

function pill(s){return `<span class="pill ${s}">${s}</span>`}
function esc(s){return String(s??'').replace(/</g,'&lt>')}

function extractOtp(text){
  const t=String(text||'');
  const ms=t.match(/\b(\d{4,8})\b/g)||[];
  const cands=[];
  for(const m of ms){
    if(m.length===4 && +m>=1990 && +m<=2100)continue;
    if(/^0+$/.test(m))continue;
    cands.push(m);
  }
  cands.sort((a,b)=>(a.length===6?0:1)-(b.length===6?0:1)||b.length-a.length);
  return cands[0]||null;
}
function smsKey(m){return m.id||((m.from||'')+'|'+(m.at||'')+'|'+(m.text||'').slice(0,40))}
async function fetchSms(limit){
  try{
    const r=await api('POST','/mcp',{method:'tools/call',params:{name:'phone.sms',arguments:{limit:limit||12}}});
    const arr=r.result?.content?JSON.parse(r.result.content[0].text):(r.result||[]);
    smsCache=Array.isArray(arr)?arr:[];
    let fresh=0;
    smsCache.forEach(m=>{const k=smsKey(m);if(!smsSeen[k]){smsSeen[k]=true;fresh++}});
    const badge=document.getElementById('badge-sms');
    if(badge){
      const n=smsCache.length;
      if(n>0){badge.style.display='';badge.textContent=n;badge.className='badge'+(fresh?' hot':'')}
      else badge.style.display='none';
    }
    if(fresh>0)logBottom('SMS: '+smsCache.length+' in inbox'+(smsCache[0]?.text?' — latest: '+smsCache[0].text.slice(0,60):''),'ok');
    // keep notifications tab in sync when SMS is the signal
    if(typeof fetchNotifications==='function' && bottomTab==='notifications'){/* counts refresh via startNotifPolling */}
    paintSmsBits();
    if(typeof paintHud==='function')paintHud();
    return smsCache;
  }catch(e){return smsCache}
}
function paintSmsBits(){
  const latest=smsCache[0]||null;
  const otp=latest?extractOtp(latest.text):null;
  // Phone sidebar
  const box=document.getElementById('sb-sms');
  if(box){
    box.innerHTML=smsCache.length?smsCache.slice(0,8).map(m=>{
      const code=extractOtp(m.text);
      return `<div class="sb-sms"><span class="from">← ${esc(m.from)}</span> ${esc((m.text||'').slice(0,110))}${code?` <span class="code" style="color:var(--green)">${esc(code)}</span>`:''}<br><span class="at">${esc(m.at||'')}</span></div>`;
    }).join(''):'<div style="padding:8px;color:var(--dim)">No inbound SMS yet.</div>';
  }
  // Guide-card live panel
  const live=document.getElementById('sms-live');
  if(live){
    if(!smsCache.length){live.innerHTML='<div style="color:var(--dim);padding:6px">Waiting for SMS… sign up, then codes land here.</div>';return}
    let html='';
    if(otp){
      html+=`<div class="otp-strip">Latest code <div class="code">${esc(otp)}</div><div class="meta">from ${esc(latest.from||'?')} · ${esc(latest.at||'')}</div></div>`;
    }
    html+='<div class="sms-live">'+smsCache.slice(0,10).map(m=>{
      const code=extractOtp(m.text);

  const knobs={dur:+document.getElementById('st-dur').value,WB_SKIP:+document.getElementById('st-skip').value,WB_SKETCH_W:+document.getElementById('st-sw').value,WB_COLOR_W:+document.getElementById('st-cw').value,WB_HOLD_S:+document.getElementById('st-hold').value,WB_BG:document.getElementById('st-bg').value,WB_SKETCH_LIGHT:document.getElementById('st-light').checked?'1':'0',WB_SMOOTH:document.getElementById('st-smooth').checked?'1':'0',no_hand:document.getElementById('st-nohand').checked,WB_SPLIT:+document.getElementById('st-split').value,WB_BRUSH:+document.getElementById('st-brush').value};
  try{const r=await api('POST','/api/studio/render',{name:studioSel,knobs});
    if(r.error){m.textContent='ERR '+r.error;return} studioJid=r.jid; studioPoll();}
  catch(e){m.textContent='ERR '+e.message}
}
async function studioPoll(){
  const m=document.getElementById('st-msg2');
  const s=await api('GET','/api/studio/job?jid='+studioJid);
  if(s.status==='running'){m.textContent='rendering…';setTimeout(studioPoll,4000);return}
  if(s.status==='error'){m.textContent='ERR';document.getElementById('st-out').innerHTML=`<pre class="fileview">${esc(s.error||'')}</pre>`;return}
  m.textContent='done';
  document.getElementById('st-out').innerHTML=`<video controls style="width:100%;max-width:640px;background:#000" src="${s.mp4}&token=${encodeURIComponent(T)}"></video><br>`+
    (s.frames||[]).map(f=>`<img style="width:100%;max-width:640px" src="${f.url}&token=${encodeURIComponent(T)}"><br><span style="color:var(--dim)">${f.t}s</span><br>`).join('')+
    `<pre class="fileview">${esc((s.log||'').slice(-800))}</pre>`;
}
async function studioPublish(){
  const m=document.getElementById('st-msg3'); if(!studioJid){m.textContent='render first';return}
  m.textContent='uploading to powoutputs/test/…';
  try{const r=await api('POST','/api/studio/publish',{jid:studioJid,title:document.getElementById('st-title').value||'sleep-test'});
    m.textContent=r.key||('ERR '+(r.error||''));}
  catch(e){m.textContent='ERR '+e.message}
}
async function studioNarrate(){
  const m=document.getElementById('st-msg4'); m.textContent='rendering voice…';
  try{const r=await api('POST','/api/studio/narrate',{text:document.getElementById('st-text').value,voice:document.getElementById('st-voice').value});
    if(r.error){m.textContent='ERR '+r.error;return}
    m.textContent=`done (${r.chars} chars, ${r.voice})`;
    document.getElementById('st-vox').innerHTML=`<audio controls src="${r.url}&token=${encodeURIComponent(T)}"></audio>`;}
  catch(e){m.textContent='ERR '+e.message}
}

  <div style="color:var(--dim)">FLUX art → draw knobs → 30s landscape → test channel. House rule: white-on-black, no text, minimal.</div>
  <h4>1 · art</h4>
  <input id="st-p" size="55" placeholder="crescent moon over still black water, extremely minimal, vast black">
  <select id="st-s"><option>pencil</option><option>paper</option><option>chalk</option></select>
  <select id="st-m"><option>flux</option><option>sdxl</option><option>lightning</option><option>dreamshaper</option></select>
  <button onclick="studioGen()">generate</button> <span id="st-msg"></span>
  <button onclick="studioLora1()" title="fill lora1 house recipe">lora1</button>
  <button onclick="studioLora2()" title="fill lora2 etched recipe">lora2</button>
  <div id="st-gal"></div>
  <h4>2 · draw knobs</h4>
  duration <select id="st-dur"><option value="15000">15s</option><option value="30000" selected>30s</option><option value="60000">60s</option><option value="120000">2min</option></select>
  SKIP <input id="st-skip" size="2" value="4" title="cells/frame: higher=faster, jumpier">

  HOLD <input id="st-hold" size="2" value="3"> BG <input id="st-bg" size="8" value="#000000">

  BRUSH <input id="st-brush" size=2 value="50" title="colorize brush radius">
  <label><input type="checkbox" id="st-light" checked> SKETCH_LIGHT</label>

  <button onclick="studioRender()">render selected</button> <span id="st-msg2"></span>
  <div id="st-out"></div>

  <input id="st-text" size="55" placeholder="Settle in. Let the day dissolve behind you.">
  <select id="st-voice"><option>aria</option><option>guy</option><option>ana</option><option>christopher</option></select>
  <button onclick="studioNarrate()">narrate</button> <span id="st-msg4"></span>
  <div id="st-vox"></div>`;
  studioRefreshArt();
}
function brandColorFor(source, mailbox){
  const m=String(mailbox||source||'').toLowerCase();
  for(const [slug,b] of Object.entries(BRANDS)){
    if(m.includes(slug)||m.includes(b.domain))return b.accent;
  }
  if(/sms|phone/i.test(String(source||'')))return '#569cd6';
  return '#808080';
}
function boilDown(n){
  const otp=n.otp?` <b style="color:var(--green)">${esc(n.otp)}</b>`:'';
  if(n.kind==='email'){
    const dom=String(n.source||'').includes('@')?n.source.split('@')[1]:n.source;
    return `${esc(dom||'mail')}:${otp||esc((n.title||'').slice(0,40))}`;
  }
  if(n.kind==='sms'){
    const from=String(n.title||'').replace(/^SMS from /,'');
    return `${esc(from)}:${otp||esc((n.body||'').slice(0,30))}`;
  }
  if(n.kind==='task')return `task ${esc((n.title||'').slice(0,44))}`;
  return esc((n.title||n.kind||'').slice(0,44))+otp;
}
function hudGo(n){
  if(n.kind==='email'&&n.ref)openEmail(n.ref);
  else if(n.kind==='sms')openTab('phone',true);
  else if(n.kind==='task')openTab('chat',true);
  else if(n.kind==='receipt'||n.kind==='run')openTab('monitor',true);
  else openTab('chat',true);
}
function paintHud(){
  const bar=document.getElementById('hud');
  if(!bar)return;
  const nc=window._notifCounts||{}, ac=window._agentCounts||{};
  const tabs=`<span onclick="showBottom('notifications')" title="Notifications detail" style="cursor:pointer;color:var(--dim)">Notif <b style="color:var(--text)">${nc.total||0}</b></span><span onclick="showBottom('agents')" title="Agents detail" style="cursor:pointer;color:var(--dim)">Agents <b style="color:var(--text)">${ac.total||0}</b></span><span onclick="showBottom('runs')" title="Runs detail" style="cursor:pointer;color:var(--dim)">Runs</span>`;
  const seen=new Set((notifCache||[]).map(n=>n.kind+':'+(n.ref||n.id||n.title)));
  const extra=[];
  const topMail=(emailCache||[])[0];
  if(topMail){
    const code=extractOtp((topMail.subject||'')+' '+(topMail.summary||''));
    if(code&&!seen.has('email:'+(topMail.message_id||topMail.id)))extra.push({kind:'email',source:EMAIL_MAILBOX,title:topMail.subject,body:topMail.summary,at:topMail.received_at,otp:code,ref:topMail.message_id||topMail.id,needs_reply:true});
  }
  const topSms=(smsCache||[])[0];
  if(topSms){
    const code=extractOtp(topSms.text);
    if(code)extra.push({kind:'sms',source:'phone',title:'SMS from '+(topSms.from||'?'),body:topSms.text,at:topSms.at,otp:code,ref:topSms.id});
  }
  const items=[...extra,...(notifCache||[])].slice(0,8);
  if(!items.length){bar.innerHTML=tabs+'<span style="color:var(--dim)">quiet — nothing needs you</span>';return}
  bar.innerHTML=tabs+items.map((n,i)=>{
    const col=brandColorFor(n.source,n.source);
    const flag=n.needs_reply?' ●':'';
    return `<span onclick='hudGoByIdx(${i})' title="${esc(n.kind)} · ${esc(n.source||'')} · ${esc(n.at||'')} — click to open" style="cursor:pointer;border-left:3px solid ${col};background:var(--bg3);border-radius:4px;padding:2px 8px;flex-shrink:0">${boilDown(n)}<span style="color:${col}">${flag}</span></span>`;
  }).join('');
  bar._items=items;
}
function hudGoByIdx(i){
  const n=(document.getElementById('hud')._items||[])[i];
  if(n)hudGo(n);
}
let bottomTab='notifications';
function showBottom(name,el){
  const c=document.getElementById('bottom-content');
  if(!c)return;
  if(bottomTab===name&&c.style.display!=='none'&&(!el||el.dataset?.hud)){
    c.style.display='none';return;
  }
  document.querySelectorAll('.bottom-tab').forEach(t=>t.classList.remove('active'));
  if(el&&el.classList)el.classList.add('active');
  bottomTab=name;
  c.style.display='block';
  paintBottom();
}
function paintBottom(){
  const el=document.getElementById('bottom-content');if(!el)return;
  const ts=()=>new Date().toLocaleTimeString();
  if(bottomTab==='notifications'){
    const items=notifCache||[];
    const c=window._notifCounts||{};
    el.innerHTML=`<div class="line"><span class="ts">${ts()}</span><span class="info">notifications · ${c.total||items.length} events · ${c.sms||0} sms · ${c.email||0} email · ${c.attention||0} attention · live 10s</span></div>`+
      (items.length?items.slice(0,40).map(n=>{
        const otp=n.otp?` <span class="code" style="color:var(--green)">${esc(n.otp)}</span>`:'';
        const flag=n.needs_reply?'<span class="err">needs</span>':(n.ok===false?'<span class="err">fail</span>':'<span class="ok">ok</span>');
        return `<div class="line"><span class="ts">${esc((n.at||'').slice(11,19)||(n.at||'').slice(0,16))}</span><span class="info">${kindIcon(n.kind)} ${esc(n.kind)} · ${esc(n.title||'')}</span>${otp} ${flag}<br><span class="ts"></span><span>${esc((n.body||'').slice(0,160))}</span></div>`;
      }).join(''):`<div class="line"><span class="ok">quiet — no notifications yet</span></div>`);
    el.scrollTop=999999;
  }else if(bottomTab==='agents'){
    const items=agentCache||[];
    const c=window._agentCounts||{};
    el.innerHTML=`<div class="line"><span class="ts">${ts()}</span><span class="info">agents · ${c.total||items.length} events · ${c.receipts_fail||0} failed receipts · ${c.pending||0} pending · ${c.tasks||0} tasks</span></div>`+
      (items.length?items.slice(0,40).map(n=>{
        const flag=n.needs_reply?'<span class="err">pending</span>':(n.ok===false?'<span class="err">fail</span>':'<span class="ok">ok</span>');
        return `<div class="line"><span class="ts">${esc((n.at||'').slice(11,19)||(n.at||'').slice(0,16))}</span><span class="info">${kindIcon(n.kind)} ${esc(n.kind)} · ${esc(n.title||'')}</span> ${flag}<br><span class="ts"></span><span>${esc((n.body||'').slice(0,160))}</span></div>`;
      }).join(''):`<div class="line"><span class="ok">agent feed empty</span></div>`);
    el.scrollTop=999999;
  }else if(bottomTab==='runs'){
    el.innerHTML='';
    (S?.runs||[]).slice(0,20).forEach(r=>logBottom(`${r.id} ${r.summary}`, r.status==='OK'?'ok':'err'));
    (S?.tasks||[]).slice(0,10).forEach(t=>logBottom(`${t.id} ${t.title}`,'info'));
  }
  paintHud();
}
function logBottom(text,cls='info'){
  const el=document.getElementById('bottom-content'),ts=new Date().toLocaleTimeString();
  el.innerHTML+=`<div class="line"><span class="ts">${ts}</span><span class="${cls}">${esc(text)}</span></div>`;
  el.scrollTop=999999;
}

(function(){
  const divider=document.getElementById('chat-divider'),panel=document.getElementById('chat-panel');
  let dragging=false,startX,startW;
  divider.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX;startW=panel.offsetWidth;divider.classList.add('dragging');e.preventDefault()});
  document.addEventListener('mousemove',e=>{if(!dragging)return;panel.style.width=Math.max(200,Math.min(600,startW-(e.clientX-startX)))+'px'});
  document.addEventListener('mouseup',()=>{if(dragging){dragging=false;divider.classList.remove('dragging')}});
})();

renderChatSidebar();refresh();startSmsPolling();startEmailPolling();startNotifPolling();paintBottom();setInterval(refresh,15000);
</script>
