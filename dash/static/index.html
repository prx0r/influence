<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>influence</title>
<style>
:root{--bg:#1e1e1e;--bg2:#252526;--bg3:#2d2d2d;--bg4:#3c3c3c;--border:#404040;--text:#cccccc;--dim:#808080;--blue:#569cd6;--green:#4ec9b0;--red:#f44747;--yellow:#dcdcaa;--accent:#007acc}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.titlebar{height:30px;background:var(--bg3);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--border)}
.titlebar .menu{display:flex;gap:4px}
.titlebar .menu span{padding:2px 8px;border-radius:4px;cursor:pointer}
.titlebar .menu span:hover{background:var(--bg4)}
.main{flex:1;display:flex;overflow:hidden}
.activity{width:48px;background:var(--bg3);display:flex;flex-direction:column;align-items:center;padding-top:4px;border-right:1px solid var(--border)}
.activity .icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim);font-size:20px;position:relative}
.activity .icon:hover{color:var(--text)}
.activity .icon.active{color:var(--text);border-left:2px solid var(--accent)}
.activity .icon .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:10px 16px;font-size:11px;text-transform:uppercase;color:var(--dim);letter-spacing:1px;border-bottom:1px solid var(--border)}
.sidebar-content{flex:1;overflow-y:auto;padding:8px}
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;background:var(--bg3);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;border-right:1px solid var(--border);color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--bg);color:var(--text);border-top:1px solid var(--accent)}
.tab .close{opacity:0;font-size:14px;border-radius:4px;padding:0 4px}
.tab:hover .close{opacity:1}
.tab .close:hover{background:var(--bg4)}
.editor{flex:1;overflow-y:auto;padding:16px}
.res{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg4);font-size:12px}
.pill{font-family:monospace;font-size:10px;padding:1px 8px;border-radius:20px;white-space:nowrap}
.READY{background:#123f2c;color:#7fe0a8}.MISSING{background:#3f2f12;color:var(--yellow)}.BLOCKED{background:#3f1a12;color:var(--red)}.UNKNOWN{background:#2b2d2d;color:#bbb}.ERROR{background:#3f1a12;color:#fff}
.bar{height:8px;background:#111;border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green)}
.bottom-panel{height:180px;border-top:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column}
.bottom-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px}
.bottom-tab{padding:6px 12px;font-size:11px;cursor:pointer;color:var(--dim);text-transform:uppercase}
.bottom-tab:hover{color:var(--text)}
.bottom-tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
.bottom-content{flex:1;overflow-y:auto;padding:8px 16px;font:12px/1.4 'SF Mono',Monaco,monospace;color:var(--dim)}
.bottom-content .line{padding:1px 0}
.bottom-content .line .ts{color:#555;margin-right:8px}
.bottom-content .line .info{color:var(--blue)}
.bottom-content .line .ok{color:var(--green)}
.bottom-content .line .err{color:var(--red)}
.chat-panel{width:320px;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg2);position:relative}
.chat-divider{width:4px;cursor:col-resize;background:transparent;position:absolute;left:-2px;top:0;bottom:0;z-index:10}
.chat-divider:hover,.chat-divider.dragging{background:var(--accent)}
.rail-list{flex:1;overflow-y:auto;padding:8px}
.chat-messages{flex:1;overflow-y:auto;padding:12px}
.chat-msg{margin-bottom:8px;font-size:12px}
.chat-msg .who{color:var(--dim);font-size:10px}
.chat-msg .text{margin-top:2px;padding:6px 10px;border-radius:4px;background:var(--bg3);word-break:break-word}
.chat-msg.you .text{background:#1a3a5a}
.chat-input{display:flex;border-top:1px solid var(--border);padding:8px}
.chat-input input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:12px}
.chat-input button{margin-left:6px;background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}
.vault-item{padding:8px 12px;border-bottom:1px solid var(--bg4);font-size:12px}
.vault-item .name{color:var(--blue)}
.vault-item .meta{color:var(--dim);font-size:10px}
.tree-item{padding:4px 8px 4px 16px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px}
.tree-item:hover{background:var(--bg3)}
.tree-header{padding:6px 8px;font-size:11px;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between}
.frm{padding:8px;display:flex;flex-direction:column;gap:6px}
.frm input,.frm select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px}
.frm button{background:var(--accent);color:#fff;border:none;padding:6px;border-radius:4px;cursor:pointer}
.task{padding:8px 12px;border-bottom:1px solid var(--bg4);font-size:12px}
.task .t{font-weight:600}
.task .opts{display:flex;gap:6px;margin-top:6px}
.task .opts button{background:var(--bg4);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 10px;cursor:pointer;font-size:11px}
.task .opts button:hover{border-color:var(--accent)}
.fileview{white-space:pre-wrap;font:12px/1.5 'SF Mono',Monaco,monospace;background:var(--bg2);padding:12px;border-radius:4px;overflow-x:auto}
.filecrumb{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px}
.filecrumb input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:12px}
.filecrumb button{background:var(--bg4);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>

<div class="titlebar">
  <div class="menu"><span>File</span><span>Edit</span><span>View</span><span>Run</span><span>Help</span></div>
  <span style="margin-left:auto">influence — agent control plane</span>
</div>

<div class="main">
  <div class="activity">
    <div class="icon active" onclick="switchView('chat',this)" title="Chat">💬</div>
    <div class="icon" onclick="switchView('influencers',this)" title="Influencers">🛰</div>
    <div class="icon" onclick="switchView('vault',this)" title="Vault">🔑</div>
    <div class="icon" onclick="switchView('tasks',this)" title="Tasks">✅<span class="badge" id="badge-tasks">0</span></div>
    <div class="icon" onclick="switchView('terminal',this)" title="Terminal">🖥</div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebar-title">Chat</div>
    <div class="sidebar-content" id="sidebar-content"></div>
  </div>
  <div class="editor-area">
    <div class="tabs" id="editor-tabs"></div>
    <div class="editor" id="editor-main"></div>
    <div class="bottom-panel">
      <div class="bottom-tabs">
        <div class="bottom-tab active" onclick="showBottom('output',this)">Output</div>
        <div class="bottom-tab" onclick="showBottom('tasks',this)">Tasks</div>
        <div class="bottom-tab" onclick="showBottom('runs',this)">Runs</div>
      </div>
      <div class="bottom-content" id="bottom-content"></div>
    </div>
  </div>
  <div class="chat-panel" id="chat-panel">
    <div class="chat-divider" id="chat-divider"></div>
    <div class="sidebar-header">HTasks — human rail</div>
    <div style="border-bottom:1px solid var(--border)">
      <div class="tree-header">Seal secret (straight to vault)</div>
      <div class="frm">
        <input id="v-name" placeholder="NAME (e.g. X_BEARER)">
        <input id="v-value" type="password" placeholder="value — never touches chat" autocomplete="off">
        <select id="v-kind"><option value="service">service</option><option value="llm-inference">llm-inference</option><option value="cloudflare">cloudflare</option><option value="other">other</option></select>
        <button onclick="depositVault()">Seal into vault</button>
      </div>
    </div>
    <div class="rail-list" id="rail-tasks"></div>
  </div>
</div>

<script>
const T=new URLSearchParams(location.search).get("token")||"";
const api=(m,p,b,o)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),o?.timeoutMs||60000);return fetch(p+"?token="+encodeURIComponent(T),{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined,signal:c.signal}).finally(()=>clearTimeout(t)).then(r=>r.json())};
let S=null, openTabs=[], activeTab=null, curPath="";

function pill(s){return `<span class="pill ${s}">${s}</span>`}
function esc(s){return String(s??'').replace(/</g,'&lt;')}

async function refresh(){try{S=await api('GET','/api/state');document.getElementById('badge-tasks').textContent=S.tasks.length;renderRail();renderTabs();if(activeTab)openTab(activeTab,true);}catch(e){}}

function switchView(name,el){
  document.querySelectorAll('.activity .icon').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sidebar-title').textContent=name[0].toUpperCase()+name.slice(1);
  ({chat:renderChatSidebar,influencers:renderInfSidebar,vault:renderVaultSidebar,tasks:renderTasksSidebar,terminal:renderTerminalSidebar}[name])();
}
function renderChatSidebar(){
  document.getElementById('sidebar-content').innerHTML=`
    <div style="padding:8px;font-size:11px;color:var(--dim)">Commands run on the graph. Chat lives in the center tab.</div>
    <div class="tree-item" onclick="quickChat('/status')">/status — queue + stages</div>
    <div class="tree-item" onclick="quickChat('/help')">/help — all commands</div>
    <div class="tree-header">Add influencer</div>
    <div class="frm"><input id="q-slug" placeholder="slug"><input id="q-domain" placeholder="domain.dev">
    <button onclick="quickChat('/add '+document.getElementById('q-slug').value+' '+document.getElementById('q-domain').value)">Add + reconcile</button></div>`;
}
function renderInfSidebar(){
  const el=document.getElementById('sidebar-content');
  if(!S||!S.influencers.length){el.innerHTML='<div style="padding:8px;color:var(--dim)">Empty. Add one from Chat.</div>';return}
  el.innerHTML='<div class="tree-header">Influencers</div>'+S.influencers.map(i=>{
    const r=i.resources.filter(x=>x.status==='READY').length;
    return `<div class="tree-item" onclick="openTab('${i.slug}')">🛰 ${esc(i.name)} <span style="color:var(--dim)">${r}/${i.resources.length}</span></div>`}).join('');
}
async function renderVaultSidebar(){
  const el=document.getElementById('sidebar-content');
  let keys=[];try{keys=(await api('GET','/api/vault')).keys||[]}catch(e){}
  el.innerHTML=`<div style="padding:8px;font-size:11px;color:var(--dim)">Seal from the HTask rail — values never render, here or anywhere.</div>
    <div class="tree-header">Keys (${keys.length})</div>`+
    (keys.map(k=>`<div class="vault-item"><div class="name">${esc(k.name)}</div><div class="meta">${esc(k.kind)} · ${esc(k.tier)} · uses ${k.usage?.calls||0}</div></div>`).join('')||'<div style="padding:8px;color:var(--dim)">none yet</div>');
}
function renderTasksSidebar(){
  const el=document.getElementById('sidebar-content');
  el.innerHTML='<div style="padding:8px;font-size:11px;color:var(--dim)">Decide from the HTask rail on the right.</div><div class="tree-header">Queue</div>'+((S?.tasks||[]).map(t=>`
    <div class="task"><div class="t">${esc(t.title)}</div>
    <div style="color:var(--dim);font-size:10px">${esc(t.influencer)} · ${esc(t.resource_key)}</div></div>`).join('')||'<div style="padding:8px;color:var(--dim)">Queue empty. Clean.</div>');
}
async function depositVault(){
  const name=document.getElementById('v-name').value.trim(),value=document.getElementById('v-value').value;
  const kind=document.getElementById('v-kind').value;
  if(!name||!value){logBottom('vault: name + value required','err');return}
  const r=await api('POST','/api/vault-store',{name,value,kind});
  logBottom(r.ok?`vault: sealed ${name}`:`vault failed: ${r.error}`,r.ok?'ok':'err');
  document.getElementById('v-value').value='';
  renderRail();renderVaultSidebar();
}
function renderRail(){
  const el=document.getElementById('rail-tasks');
  el.innerHTML=((S?.tasks||[]).map(t=>`
    <div class="task"><div class="t">${esc(t.title)}</div>
    <div style="color:var(--dim);font-size:10px">${esc(t.influencer)} · ${esc(t.resource_key)}</div>
    <div class="opts">${Object.entries(t.options||{}).map(([k,v])=>`<button onclick="decideTask('${t.id}','${k}')" title="${esc(v)}">${k}</button>`).join('')}</div></div>`).join('')||'<div style="padding:8px;color:var(--dim)">Queue empty. Clean.</div>');
}
async function decideTask(id,digit){
  const p=await api('POST','/api/present',{task_id:id});
  if(!p.ok){logBottom('present failed: '+p.error,'err');return}
  const r=await api('POST','/api/decide',{task_id:id,digit,prediction_ref:p.prediction_ref});
  logBottom(r.ok?`${id} → ${r.state}`:`rejected: ${r.error}`,r.ok?'ok':'err');
  refresh();
}
function renderTerminalSidebar(){
  document.getElementById('sidebar-content').innerHTML=`
    <div style="padding:8px;font-size:11px;color:var(--dim)">Graph ops</div>
    <div class="tree-item" onclick="quickChat('/status')">Queue + stages</div>
    <div class="tree-item" onclick="termReconcile()">Reconcile all</div>
    <div class="tree-item" onclick="refresh()">Refresh state</div>`;
}
async function termReconcile(){const r=await api('POST','/api/reconcile',{});logBottom(r.ok?`reconciled ${r.projects} projects`:'reconcile failed',r.ok?'ok':'err');refresh()}

function renderTabs(){
  const el=document.getElementById('editor-tabs');
  const tabs=['monitor','chat','files',...(S?.influencers||[]).map(i=>i.slug)];
  openTabs=openTabs.filter(t=>tabs.includes(t));
  if(!openTabs.length&&tabs.length)openTabs=['monitor'];
  if(activeTab&&!openTabs.includes(activeTab))activeTab=openTabs[0];
  el.innerHTML=openTabs.map(t=>`<div class="tab ${t===activeTab?'active':''}" onclick="openTab('${t}')">${t}<span class="close" onclick="closeTab('${t}',event)">×</span></div>`).join('');
}
function openTab(t,soft){
  if(!openTabs.includes(t))openTabs.push(t);
  activeTab=t;renderTabs();
  const main=document.getElementById('editor-main');
  if(t==='monitor'){
    main.innerHTML=`<h3 style="margin-bottom:8px">Monitor</h3>`+((S?.runs||[]).map(r=>`<div class="res"><span><b>${esc(r.id)}</b> ${esc(r.summary)}<br><span style="color:var(--dim)">${esc(r.influencer)}${r.receipt_id?` · <span style="font-family:monospace">${esc(r.receipt_id)}</span> ${r.passed?'PASS':'FAIL'}`:''}${r.evidence_root?`<br>evidence <span style="font-family:monospace">${esc(String(r.evidence_root).slice(0,24))}…</span>`:''}${r.gates?`<br>gates ${r.gates.map(g=>esc(g.id.split('-')[0])+':'+esc(g.result)).join(' ')}`:''}</span></span></div>`).join('')||'<div style="color:var(--dim)">No runs yet.</div>');
    return;
  }
  if(t==='chat'){
    main.innerHTML=`<div class="chat-messages" id="chat-messages-main" style="max-height:60vh"></div>
      <div class="chat-input"><input id="chat-in-main" placeholder="/add slug domain · /status · /help"><button onclick="sendChatMain()">→</button></div>`;
    document.getElementById('chat-in-main').addEventListener('keydown',e=>{if(e.key==='Enter')sendChatMain()});
    return;
  }
  if(t==='files'){
    main.innerHTML=`<h3 style="margin-bottom:8px">Files — influence repo (read-only)</h3>
      <div class="filecrumb"><input id="file-path" value="${esc(curPath||'products')}"><button onclick="openFilePath()">Open</button></div>
      <div id="file-body"><div style="color:var(--dim)">Pick a file.</div></div>`;
    document.getElementById('file-path').addEventListener('keydown',e=>{if(e.key==='Enter')openFilePath()});
    openFilePath();
    return;
  }
  const i=(S?.influencers||[]).find(x=>x.slug===t);
  if(!i){main.innerHTML='<div style="color:var(--dim)">gone — refresh</div>';return}
  const ready=i.resources.filter(r=>r.status==='READY').length,pct=Math.round(100*ready/i.resources.length);
  main.innerHTML=`<h3>${esc(i.name)} <span style="color:var(--dim);font-size:11px">${esc(i.slug)} · ${esc(i.stage)}</span></h3>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div style="color:var(--dim);font-size:11px;margin-bottom:8px">${ready}/${i.resources.length} READY</div>`
    +i.resources.map(r=>`<div class="res"><span>${esc(r.label)}<br><span style="color:var(--dim)">${esc(r.message)}</span></span>${pill(r.status)}</div>`).join('');
}
function closeTab(t,e){e.stopPropagation();openTabs=openTabs.filter(x=>x!==t);if(activeTab===t)activeTab=openTabs[0];renderTabs();if(activeTab)openTab(activeTab,true);else document.getElementById('editor-main').innerHTML=''}
async function openFilePath(){
  const p=document.getElementById('file-path').value.trim()||'products';
  curPath=p;
  const body=document.getElementById('file-body');
  body.innerHTML='<div style="color:var(--dim)">Loading…</div>';
  try{
    const r=await api('GET','/api/files?path='+encodeURIComponent(p));
    if(r.error){body.innerHTML=`<div style="color:var(--red)">${esc(r.error)}</div>`;return}
    if(r.entries){
      body.innerHTML=r.entries.map(e=>`<div class="tree-item" onclick="openFileEntry('${esc(e.path)}',${e.dir})">${e.dir?'📁':'📄'} ${esc(e.name)}${e.dir?'':' <span style="color:var(--dim)">'+e.size+'b</span>'}</div>`).join('')||'<div style="color:var(--dim)">Empty.</div>';
    }else{
      body.innerHTML=`<div class="fileview">${esc(r.content)}</div>`;
    }
  }catch(e){body.innerHTML=`<div style="color:var(--red)">Error: ${esc(e.message)}</div>`}
}
function openFileEntry(path,isDir){document.getElementById('file-path').value=path;openFilePath()}

function chatMsgMain(who,text){const d=document.createElement('div');d.className='chat-msg '+(who==='you'?'you':'');d.innerHTML=`<div class="who">${who}</div><div class="text">${esc(text).replace(/\n/g,'<br>')}</div>`;const m=document.getElementById('chat-messages-main');if(!m)return;m.appendChild(d);m.scrollTop=999999}
async function sendChatMain(){
  const inp=document.getElementById('chat-in-main');if(!inp)return;const v=inp.value.trim();if(!v)return;inp.value='';
  chatMsgMain('you',v);
  try{const r=await api('POST','/api/chat',{message:v},{timeoutMs:90000});chatMsgMain('graph',r.reply||'(empty)');if(r.refresh)refresh()}
  catch(e){chatMsgMain('graph','Error: '+e.message)}
}
function quickChat(msg){openTab('chat',true);const inp=document.getElementById('chat-in-main');if(inp){inp.value=msg;sendChatMain()}}

function logBottom(text,cls='info'){
  const el=document.getElementById('bottom-content'),ts=new Date().toLocaleTimeString();
  el.innerHTML+=`<div class="line"><span class="ts">${ts}</span><span class="${cls}">${esc(text)}</span></div>`;
  el.scrollTop=999999;
}
function showBottom(name,el){
  document.querySelectorAll('.bottom-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('bottom-content').innerHTML='';
  if(name==='tasks')(S?.tasks||[]).slice(0,20).forEach(t=>logBottom(`${t.id} ${t.title}`,'info'));
  if(name==='runs')(S?.runs||[]).slice(0,20).forEach(r=>logBottom(`${r.id} ${r.summary}`,'ok'));
}

(function(){
  const divider=document.getElementById('chat-divider'),panel=document.getElementById('chat-panel');
  let dragging=false,startX,startW;
  divider.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX;startW=panel.offsetWidth;divider.classList.add('dragging');e.preventDefault()});
  document.addEventListener('mousemove',e=>{if(!dragging)return;panel.style.width=Math.max(200,Math.min(600,startW-(e.clientX-startX)))+'px'});
  document.addEventListener('mouseup',()=>{if(dragging){dragging=false;divider.classList.remove('dragging')}});
})();

renderChatSidebar();refresh();setInterval(refresh,15000);
</script>
</body>
</html>
