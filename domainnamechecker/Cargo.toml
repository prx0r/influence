[package]
name = "domainnamechecker"
version = "0.1.0"
edition = "2021"

# Note: R2 storage integration requires rustc 1.94+ for AWS SDK.
# To enable: add aws-config, aws-sdk-s3, aws-credential-types, dotenv deps
# and restore the R2 commands in main.rs.

[dependencies]
tokio = { version = "1", features = ["full"] }
hickory-resolver = "0.24"
hickory-proto = "0.24"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
